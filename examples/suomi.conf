# Suomalaiset raporttiasetukset: suomen kieli, metriset yksiköt, 24 tunnin
# kello ja päivämäärät muodossa 31.10.2026.
#
# Alpinen musl-libc ei muotoile päivämääriä lokaalin mukaan (%x on aina
# 10/31/26), joten muodot annetaan tässä suoraan. Viikonpäivien ja
# kuukausien nimiä (%A, %b) ei käytetä, koska musl antaisi ne englanniksi.
#
# Yhdistä tämä tiedostoon /etc/weewx/weewx.conf (ks. README) ja käynnistä
# WeeWX uudelleen.

[StdReport]
    [[Defaults]]
        lang = fi
        unit_system = metricwx
        [[[Units]]]
            [[[[TimeFormats]]]]
                hour = %H:%M
                day = %H:%M
                week = %d.%m.%Y %H:%M
                month = %d.%m.%Y %H:%M
                season = %d.%m.%Y %H:%M
                year = %d.%m.%Y %H:%M
                rainyear = %d.%m.%Y %H:%M
                seasonsyear = %d.%m.%Y %H:%M
                current = %d.%m.%Y %H:%M
                ephem_day = %H:%M
                ephem_year = %d.%m.%Y %H:%M

    # kuvaajien alareunan aikaleima; Seasons-skin asettaa sen erikseen
    # jokaiselle aikavälille, joten se ohitetaan samoin
    [[SeasonsReport]]
        [[[ImageGenerator]]]
            [[[[day_images]]]]
                bottom_label_format = %d.%m.%Y %H:%M
            [[[[week_images]]]]
                bottom_label_format = %d.%m.%Y %H:%M
            [[[[month_images]]]]
                bottom_label_format = %d.%m.%Y %H:%M
            [[[[year_images]]]]
                bottom_label_format = %d.%m.%Y %H:%M
