---
# WeeWX from the weewx-alpine repository and nginx serving its reports, on
# Alpine Linux 3.22 or newer. See README.md.
- name: Set up WeeWX and nginx
  hosts: weewx
  become: true
  gather_facts: false

  pre_tasks:
    - name: Install Python for Ansible
      ansible.builtin.raw: test -e /usr/bin/python3 || apk add --no-cache python3
      register: weewx_python
      changed_when: weewx_python.stdout is search('OK:')

    - name: Gather facts
      ansible.builtin.setup:
        gather_subset: [min]

  roles:
    - weewx
    - weewx_nginx

  post_tasks:
    # Diskless mode keeps /etc in RAM: save the changes with lbu, but only when
    # there are any.
    - name: Look for changes to save with lbu
      ansible.builtin.command: lbu status
      register: weewx_lbu_status
      changed_when: false
      check_mode: false
      when: weewx_run_from_ram

    - name: Save the configuration with lbu
      ansible.builtin.command: lbu commit
      changed_when: true
      when: weewx_run_from_ram and weewx_lbu_status.stdout | trim | length > 0
