---
- name: Find the file systems of / and of the database directory
  ansible.builtin.shell: |
    set -eu
    fstype() { awk -v p="$1" '$2 == p { t = $3 } END { print t }' /proc/mounts; }
    fstype /
    for p in /var/lib/weewx /var/lib /var /; do
      t=$(fstype "$p")
      if [ -n "$t" ]; then echo "$p $t"; break; fi
    done
  register: weewx_fstypes
  changed_when: false
  check_mode: false

- name: Note whether Alpine runs from RAM
  ansible.builtin.set_fact:
    weewx_run_from_ram: >-
      {{ (weewx_fstypes.stdout_lines[0] == 'tmpfs') if weewx_diskless is none
         else (weewx_diskless | bool) }}

- name: Check that weewx survives a reboot when Alpine runs from RAM
  when: weewx_run_from_ram and weewx_check_persistence
  block:
    - name: Check that the database directory is on a disk
      ansible.builtin.assert:
        that: weewx_fstypes.stdout_lines[1].split()[1] != 'tmpfs'
        fail_msg: >-
          Alpine runs from RAM (diskless mode) and so does {{ weewx_fstypes.stdout_lines[1].split()[0] }},
          so the WeeWX database in /var/lib/weewx would be lost at every reboot.
          Install Alpine in sys mode (setup-disk -m sys), use data disk mode (/var on a disk),
          or set weewx_check_persistence to false.
        quiet: true

    - name: Look for the apk cache
      ansible.builtin.stat:
        path: /etc/apk/cache
        follow: true
      register: weewx_apk_cache

    - name: Check that the apk cache is set up
      ansible.builtin.assert:
        that: weewx_apk_cache.stat.isdir is defined and weewx_apk_cache.stat.isdir
        fail_msg: >-
          Alpine runs from RAM and reinstalls its packages from the apk cache at boot,
          but /etc/apk/cache is missing: weewx and nginx would be gone after a reboot.
          Set up the cache with setup-apkcache.
        quiet: true

- name: Read the apk repositories
  ansible.builtin.slurp:
    src: /etc/apk/repositories
  register: weewx_apk_repositories

- name: Find the Alpine mirror and branch from the main repository
  ansible.builtin.set_fact:
    weewx_main_repo: >-
      {{ weewx_apk_repositories.content | b64decode
         | regex_search('^\s*(\S+)/(v[0-9]+\.[0-9]+|edge)/main\s*$', '\1', '\2', multiline=True) }}

- name: Check that the main repository was found
  ansible.builtin.assert:
    that: weewx_main_repo | length == 2
    fail_msg: No Alpine main repository (.../v3.xx/main or .../edge/main) in /etc/apk/repositories
    quiet: true

- name: Enable the community repository
  ansible.builtin.lineinfile:
    path: /etc/apk/repositories
    regexp: '^#?\s*{{ weewx_main_repo[0] | regex_escape }}/{{ weewx_main_repo[1] }}/community\s*$'
    line: "{{ weewx_main_repo[0] }}/{{ weewx_main_repo[1] }}/community"

- name: Install the signing key of the weewx-alpine repository
  ansible.builtin.get_url:
    url: "{{ weewx_repo_url }}/{{ weewx_repo_key }}"
    dest: /etc/apk/keys/{{ weewx_repo_key }}
    checksum: sha256:{{ weewx_repo_key_sha256 }}
    mode: "0644"

- name: Add the weewx-alpine repository
  ansible.builtin.lineinfile:
    path: /etc/apk/repositories
    regexp: '^#?\s*{{ weewx_repo_url | regex_escape }}/'
    line: "{{ weewx_repo_url }}/{{ weewx_main_repo[1] }}"

- name: Install WeeWX
  community.general.apk:
    name: "{{ weewx_packages + weewx_extra_packages }}"
    state: "{{ weewx_package_state }}"
    update_cache: true
  notify: Restart weewx

- name: Set the time zone
  when: weewx_timezone | length > 0
  notify: Restart weewx
  block:
    - name: Point /etc/localtime to the time zone
      ansible.builtin.file:
        src: /usr/share/zoneinfo/{{ weewx_timezone }}
        dest: /etc/localtime
        state: link
        force: true

    - name: Write /etc/timezone
      ansible.builtin.copy:
        content: "{{ weewx_timezone }}\n"
        dest: /etc/timezone
        mode: "0644"

- name: Configure the station
  weewx_conf:
    path: "{{ weewx_config_path }}"
    driver: "{{ weewx_driver }}"
    settings: "{{ weewx_conf_defaults | combine(weewx_conf, recursive=True) }}"
  notify: Restart weewx

- name: Keep weewx.conf readable only by the weewx group
  ansible.builtin.file:
    path: "{{ weewx_config_path }}"
    owner: weewx
    group: weewx
    mode: "0660"

- name: Set the options of weewxd
  ansible.builtin.lineinfile:
    path: /etc/conf.d/weewx
    regexp: ^#?weewx_opts=
    line: weewx_opts="{{ weewx_opts }}"
  when: weewx_opts | length > 0
  notify: Restart weewx

- name: Start WeeWX now and at boot
  ansible.builtin.service:
    name: weewx
    state: started
    enabled: true
